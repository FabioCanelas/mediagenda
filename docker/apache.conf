# Apache para MediAgenda: sin versión en las cabeceras ni en las páginas de error.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Nada fuera de public/ es accesible desde la web (.env, storage, código).
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>
