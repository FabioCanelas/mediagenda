; Ajustes de PHP para MediAgenda en producción.

; No anunciar la versión de PHP en las respuestas.
expose_php = Off

; Errores al registro, nunca en pantalla (podrían mostrar datos de pacientes).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Estudios adjuntos de hasta 10 MB.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M

; Cookies de sesión solo por HTTPS y fuera del alcance de JavaScript.
session.cookie_secure = 1
session.cookie_httponly = 1
session.use_strict_mode = 1

; El código no cambia dentro del contenedor: opcache sin revisar archivos.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
